name: Weekly ArXiv Ingestion

on:
  schedule:
    - cron: '0 2 * * 1'  # Tous les lundis à 02:00 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ✅ AJOUT CRUCIAL : Installer le package en mode éditable
          pip install -e .

      - name: Run ingestion script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          EMBEDDING_MODEL: "BAAI/bge-m3"
          LLM_MODEL: "qwen/qwen2.5-32b"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEPLOYMENT: "cloud"
        run: |
          echo "🚀 Démarrage de l'ingestion hebdomadaire..."
          python scripts/ingest_recent.py