name: Monthly ArXiv Ingestion

on:
  # Déclenchement automatique : Le 1er de chaque mois à 02:00 UTC
  schedule:
    - cron: '0 2 1 * *'
  
  # Permet de le lancer manuellement depuis l'onglet "Actions" de GitHub pour tester
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion script
        env:
          # Injection des secrets GitHub dans les variables d'environnement
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          EMBEDDING_MODEL: "BAAI/bge-m3"
          LLM_MODEL: "qwen/qwen2.5-32b"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEPLOYMENT: "cloud"
        run: |
          echo " Démarrage de l'ingestion des papiers récents..."
          python scripts/ingest_recent.py